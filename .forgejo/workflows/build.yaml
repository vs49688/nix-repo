enable-openid-connect: true

on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    name: Build & Check
    runs-on: nixos
    steps:
      - name: Setup Cache
        id: cache
        uses: actions/niks3-action@v1
        with:
          server-url: https://cache.vs49688.net
          # debug: true

      - name: Dump Nix Configuration
        run: nix config show

      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Check
        run: nix flake check --all-systems

      # We're letting Nix do the parallelism here to take advantage of our cache.
      - name: Build Systems
        run: |
          set -x
          nix build --print-build-logs --no-link --keep-going --max-jobs auto \
            .#systems.CADANCE \
            .#systems.MORNINGSTAR \
            .#systems.CAPRICA \
            .#systems.AVALON \
            .#systems.TWILYSPARKLE

      # The Asahi kernels are x86_64-system derivations for aarch64 hosts, so this
      # runner builds them and niks3 serves the result to the machines.
      - name: Build Asahi kernels & m1n1
        run: |
          set -x
          nix build --print-build-logs --no-link --keep-going --max-jobs auto \
            .#nixosConfigurations.ZAIR.config.system.build.kernel \
            .#nixosConfigurations.ZAIR.config.system.build.m1n1 \
            .#nixosConfigurations.ANGELUS.config.system.build.kernel \
            .#nixosConfigurations.ANGELUS.config.system.build.m1n1 \

      # - name: Dump niks3 log
      #   if: always()
      #   run: |
      #     set -x
      #     cat "${RUNNER_TEMP:-/tmp}/niks3/daemon.log"
